<html>
    <head>
        <style>
            .search-bar{
                border-radius:5px;
            width:150px;
            height:30px;
            border: 2px solid rgb(124, 119, 119);
            }
            .search{
                margin-left: 10px;
                border-radius: 10px;
                width:300px;
                height: 30px;
                border: none;
                box-shadow:0 0 10px rgb(194, 184, 184) ;
            }
            .picture{
                border-radius:300px;
                width:300px;
                height:300px;
                vertical-align:block;
                margin-top: 40px;
                object-fit:cover;
                object-position:center;
            }
            .picture1{
            border-radius:10px;
            width:200px;
            height:300px;
            margin-left: 20px;
            object-fit: cover;
            object-position: left;
            vertical-align:inline-block;
            }
        </style>
    </head>
        <body>
            <input class="search-bar" type="text" placeholder="search"/ >
            <input class="search" type="text" placeholder="Search Google or type a URL"/>
            <img class="picture" src="thumbnails/img.jpg.jpeg" />
            <img class="picture1" src="thumbnails/img.jpg.jpeg" />
        </body>
</html>
